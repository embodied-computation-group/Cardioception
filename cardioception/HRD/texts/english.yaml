language: english
texts:
  Confidence: How confident are you in your choice?
  Decision:
    Intero: Are these beeps faster or slower than your heart?
    Extero: Are these beeps faster or slower than the previous?
  Tutorial1: "During this experiment, we will record your pulse and play beeps based on your\
    \ heart rate.\n\nYou will only be allowed to focus on the internal sensations of your\
    \ heartbeats, but not to measure your heart rate by any other means (e.g. checking pulse\
    \ at your wrist or your neck).\n        "
  Tutorial2: When you see this icon, try to focus on your heartbeat for 5 seconds. Try not
    to move, as we are recording your pulse in this period
  Tutorial3_icon: After this 'heart listening' period, you will see the same icon and hear
    a series of beeps.
  Tutorial4: |-
    Once you have provided your decision, you will also be asked to rate how confident you feel in your decision.

    Here, the maximum rating (100) means that you are totally certain in your choice, and the smallest rating (0) means that you felt that you were guessing.

    You should use mouse to select your rating
  Tutorial5: |-
    This sequence will be repeated during the task.

    At times the task may be very difficult; the difference between your true heart rate and the presented beeps may be very small.

    This means that you should try to use the entire length of the confidence scale to reflect your subjective uncertainty on each trial.

    As the task difficulty will change over time, it is rare that you will be totally confident or totally uncertain.
  Tutorial6: |-
    This concludes the tutorial. If you have any questions, please ask the experimenter now.
    Otherwise, you can continue to the main task.
  VASlabels:
  - Guess
  - Certain
  checkOximeter: Please make sure the oximeter is correctly clipped to your finger.
  correctResponse: Correct
  done: You have completed the task. Thank you for your participation.
  faster: Faster
  incorrectResponse: 'False'
  pulseTutorial1: Please place the pulse oximeter on your forefinger. Use your non-dominant
    hand as depicted in this schema.
  pulseTutorial2: If you can feel your heartbeats when you have the pulse oximeter on your
    forefinger, try to place it on another finger.
  pulseTutorial3: You can test different configurations until you find the finger which provides
    you with the least sensory input about your heart rate.
  pulseTutorial4: Please enter the number of the finger corresponding to the finger where
    you decided to place the pulse oximeter.
  slower: Slower
  stayStill: Please stay still during the recording
  textHeartListening: Listen to your heart
  textTaskStart: The task is now going to start, get ready.
  textToneListening: Listen to the tones
  textWaitTrigger: Waiting for fMRI trigger...
  tooLate: Too late
variants:
  Tutorial3_responses:
    axis: device
    values:
      keyboard: |-
        As quickly and accurately as possible, you will listen to these beeps and decide if they are faster (UP key) or slower (DOWN key) than your own heart rate.

        The beeps will ALWAYS be slower or faster than your heart. Please guess, even if you are unsure.
      mouse: |-
        As quickly and accurately as possible, you will listen to these beeps and decide if they are faster (RIGHT mouse button) or slower (LEFT mouse button) than your own heart rate.

        The beeps will ALWAYS be slower or faster than your heart. Please guess, even if you are unsure.
  Tutorial3bis:
    axis: exteroception
    values:
      'true': For some trials, instead of seeing the heart icon, you will see a listening
        icon. You will then have to listen to a first set of beeps, instead of your heart.
      'false': null
  Tutorial3ter:
    axis: device+exteroception
    values:
      keyboard/true: |-
        After these first beeps, you will see the response icons appear, and a second set of beeps will play.

        As quickly and accurately as possible, you will listen to these beeps and decide if they are faster (UP key) or slower (DOWN key) than the first set of beeps.

        The second series of beeps will ALWAYS be slower or faster than the first series. Please guess, even if you are unsure.
      keyboard/false: null
      mouse/true: |-
        After these first beeps, you will see the response icons appear, and a second set of beeps will play.

        As quickly and accurately as possible, you will listen to these beeps and decide if they are faster (RIGHT mouse button) or slower (LEFT mouse button) than the first set of beeps.

        The second series of beeps will ALWAYS be slower or faster than the first series. Please guess, even if you are unsure.
      mouse/false: null
  responseText:
    axis: device
    values:
      keyboard: Use DOWN key for slower - UP key for faster.
      mouse: Use LEFT button for slower - RIGHT button for faster.
  textBreaks:
    axis: device
    values:
      keyboard: Break. You can rest as long as you want. Just press SPACE when you want to
        resume the task.
      mouse: Break. You can rest as long as you want. Just click the mouse when you want to
        resume the task.
  textNext:
    axis: device
    values:
      keyboard: Please press SPACE to continue
      mouse: Please click the mouse to continue
