language: french
texts:
  Confidence: Etes-vous sûr de votre choix?
  Decision:
    Intero: Est-ce que ces sons sont plus rapides ou plus lents que votre coeur?
    Extero: Est-ce que ces sons sont plus rapides ou plus lents que les précédents?
  Tutorial1: "Durant cette tâche, nous allons enregistrer vos pulsations et jouer des sons\
    \ basés sur votre rythme cardiaque.\n\nVous serez uniquement autorisés à vous concentrer\
    \ sur vos sensations internes de vos battements cardiaques, mais ne mesurez pas votre\
    \ rythme cardiaque par d'autres moyens (ex. vérification du pouls au poignet ou au cou).\n\
    \        "
  Tutorial2: Quand vous voyez cette icône, essayez de vous concentrer sur vos battements cardiaques
    durant 5 secondes. Essayez de ne pas bouger, car nous enregistrons votre pouls durant
    cette période.
  Tutorial3_icon: Après cette période d'écoute du coeur, vous verrez la même icône and entendrez
    une série de bips.
  Tutorial4: |-
    Une fois que vous avez donné votre réponse, il vous sera également demandé d'estimer votre degré de confiance dans votre réponse.

    Ici, le score maximum (100) signifie que vous êtes totalement certain de votre choix, et le score minimum (0) signifie que vous devinez.

    Vous devez utiliser la souris pour sélectionner votre score
  Tutorial5: |-
    Cette séquence sera répétée durant la tâche.

    Par moment la tâche peut être très difficile ; la différence entre votre propre rythme cardiaque et les bips présentés peut être très petite.

    Cela signifie que vous devez essayer d'utiliser toute la longueur de l'échelle de confiance pour refléter votre incertitude subjective sur chaque essai.

    Comme la difficulté de la tâche évolue avec le temps, il est rare que vous soyez totalement confiant ou totalement incertain.
  Tutorial6: |-
    Ceci conclut le tutoriel. Si vous avez des questions, veuillez les poser maintenant à l'expérimentateur.
    Sinon, vous pouvez continuer avec la tâche principale.
  VASlabels:
  - Incertain
  - Tout à fait sûr
  checkOximeter: Assurez-vous que l'oxymètre est bien attaché à votre doigt.
  correctResponse: Correct
  done: Vous avez terminé la tâche. Merci pour votre participation.
  faster: Plus rapide
  incorrectResponse: Faux
  pulseTutorial1: Veuillez placer l'oxymètre de pouls sur votre index. Utilisez votre main
    non-dominante comme illustré sur ce schéma.
  pulseTutorial2: Si vous pouvez sentir vos battements de coeur quand vous portez l'oxymètre
    de pouls sur votre index, essayez de le placer sur un autre doigt.
  pulseTutorial3: Vous pouvez essayer différentes configurations jusqu'à ce que vous trouviez
    le doigt qui provoque le moins de sensations de battements cardiaques.
  pulseTutorial4: Veuillez entrer le numéro du doigt correspondant au doigt sur lequel vous
    avez décidé de placer l'oxymètre de pouls.
  slower: Plus lent
  stayStill: Veuillez ne pas bouger pendant l'enregistrement
  textHeartListening: Ecoutez votre coeur
  textTaskStart: La tâche va débuter, tenez-vous prêt.
  textToneListening: Ecoutez les sons
  textWaitTrigger: Attendez pour le déclencheur IRMf...
  tooLate: Trop tard
variants:
  Tutorial3_responses:
    axis: device
    values:
      keyboard: |-
        Aussi rapidement et précisément possible, vous écouterez ces bips et déciderez s'ils sont plus rapides (flèche vers le HAUT) ou plus lents (flèche vers le BAS) que votre propre rythme cardiaque.

        Les bips seront TOUJOURS plus lents ou plus rapides que votre coeur. Veuillez faire une estimation, même si vous n'est pas sûr.
      mouse: |-
        Aussi rapidement et précisément possible, vous écouterez ces bips et déciderez s'ils sont plus rapides (clic DROIT) ou plus lents (clic GAUCHE) que votre propre rythme cardiaque.

        Les bips seront TOUJOURS plus lents ou plus rapides que votre coeur. Veuillez faire une estimation, même si vous n'est pas sûr.
  Tutorial3bis:
    axis: exteroception
    values:
      'true': Pour certains essais, au lieu de voir une icône de coeur, vous verrez une icône
        d'écoute. Vous devrez alors écouter une première série de bips, au lieu de votre coeur.
      'false': null
  Tutorial3ter:
    axis: device+exteroception
    values:
      keyboard/true: |-
        Après ce premier bip, vous verrez l'icône de réponse apparaître, et une seconde série de bip sera joué.

        Aussi rapidement et précisément possible, vous entendrez ces bips et déciderez s'ils sont plus rapides (flèche vers le HAUT) ou plus lents (flèche vers le BAS) que la première série de bips.

        La seconde série de bips sera TOUJOURS plus lente ou rapide que la première série. Veuillez faire une estimation, même si vous n'êtes pas sûr.
      keyboard/false: null
      mouse/true: |-
        Après ce premier bip, vous verrez l'icône de réponse apparaître, et une seconde série de bip sera joué.

        Aussi rapidement et précisément possible, vous entendrez ces bips et déciderez s'ils sont plus rapides (clic DROIT) ou plus lents (clic GAUCHE) que la première série de bips.

        La seconde série de bips sera TOUJOURS plus lente ou rapide que la première série. Veuillez faire une estimation, même si vous n'êtes pas sûr.
      mouse/false: null
  responseText:
    axis: device
    values:
      keyboard: Appuyez sur la flèche vers le BAS pour plus lent - vers le HAUT pour plus
        rapide.
      mouse: Appuyez sur le clic GAUCHE pour plus lent - clic DROIT pour plus rapide.
  textBreaks:
    axis: device
    values:
      keyboard: Pause. Vous pouvez vous reposer aussi longtemps que vous le souhaitez. Simplement
        appuyez sur la barre espace quand vous désirez rependre la tâche.
      mouse: Pause. Vous pouvez vous reposer aussi longtemps que vous le souhaitez. Simplement
        cliquez sur la souris quand vous désirez rependre la tâche.
  textNext:
    axis: device
    values:
      keyboard: S'il vous plaît appuyez sur la barre espace pour continuer
      mouse: S'il vous plaît cliquez sur la souris pour continuer
