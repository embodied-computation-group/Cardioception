language: german
texts:
  Confidence: Wie sicher sind Sie sich bei Ihrer Entscheidung?
  Decision:
    Intero: Sind diese Töne schneller oder langsamer als Ihr Herzschlag?
    Extero: Sind diese Töne schneller oder langsamer als die vorherigen?
  Tutorial1: "In diesem Experiment zeichnen wir Ihren Puls auf und spielen Töne ab, die auf\
    \ Ihrer Herzfrequenz beruhen.\n\nBitte konzentrieren Sie sich ausschließlich auf die inneren\
    \ Empfindungen Ihres Herzschlags. Messen Sie Ihre Herzfrequenz nicht auf andere Weise\
    \ (z. B. indem Sie den Puls am Handgelenk oder am Hals fühlen).\n        "
  Tutorial2: Wenn Sie dieses Symbol sehen, versuchen Sie, sich 5 Sekunden lang auf Ihren Herzschlag
    zu konzentrieren. Bitte bewegen Sie sich nicht, da wir in dieser Zeit Ihren Puls aufzeichnen.
  Tutorial3_icon: Nach dieser Phase, in der Sie auf Ihren Herzschlag achten, sehen Sie dasselbe
    Symbol und hören eine Folge von Tönen.
  Tutorial5: |-
    Dieser Ablauf wiederholt sich während der gesamten Aufgabe.

    Manchmal kann die Aufgabe sehr schwierig sein, denn der Unterschied zwischen Ihrer tatsächlichen Herzfrequenz und den dargebotenen Tönen kann sehr klein sein.

    Versuchen Sie deshalb, die gesamte Breite der Konfidenzskala zu nutzen, um Ihre subjektive Unsicherheit in jedem Durchgang wiederzugeben.

    Da sich die Schwierigkeit der Aufgabe im Verlauf verändert, werden Sie sich nur selten vollkommen sicher oder vollkommen unsicher sein.
  Tutorial6: |-
    Damit ist die Einführung abgeschlossen. Wenn Sie Fragen haben, wenden Sie sich bitte jetzt an die Versuchsleitung.
    Andernfalls können Sie mit der Hauptaufgabe fortfahren.
  VASlabels:
  - Geraten
  - Sicher
  checkOximeter: Bitte stellen Sie sicher, dass das Pulsoximeter richtig an Ihrem Finger befestigt
    ist.
  correctResponse: Richtig
  done: Sie haben die Aufgabe abgeschlossen. Vielen Dank für Ihre Teilnahme.
  faster: Schneller
  incorrectResponse: Falsch
  pulseTutorial1: Bitte stecken Sie das Pulsoximeter auf Ihren Zeigefinger. Verwenden Sie
    Ihre nicht dominante Hand, wie in dieser Abbildung gezeigt.
  pulseTutorial2: Falls Sie Ihren Herzschlag spüren, wenn das Pulsoximeter an Ihrem Zeigefinger
    sitzt, versuchen Sie, es an einem anderen Finger anzubringen.
  pulseTutorial3: Sie können verschiedene Positionen ausprobieren, bis Sie den Finger gefunden
    haben, an dem Sie am wenigsten von Ihrem Herzschlag spüren.
  pulseTutorial4: Bitte geben Sie die Nummer des Fingers ein, an dem Sie das Pulsoximeter
    angebracht haben.
  slower: Langsamer
  stayStill: Bitte bewegen Sie sich während der Aufzeichnung nicht
  textHeartListening: Achten Sie auf Ihren Herzschlag
  textTaskStart: Die Aufgabe beginnt jetzt. Bitte machen Sie sich bereit.
  textToneListening: Hören Sie den Tönen zu
  textWaitTrigger: Warten auf den fMRT-Trigger...
  tooLate: Zu spät
variants:
  Tutorial3_responses:
    axis: device
    values:
      keyboard: |-
        Hören Sie diesen Tönen zu und entscheiden Sie so schnell und so genau wie möglich, ob sie schneller (Taste NACH OBEN) oder langsamer (Taste NACH UNTEN) sind als Ihre eigene Herzfrequenz.

        Die Töne sind IMMER langsamer oder schneller als Ihr Herzschlag. Bitte raten Sie, auch wenn Sie unsicher sind.
      mouse: |-
        Hören Sie diesen Tönen zu und entscheiden Sie so schnell und so genau wie möglich, ob sie schneller (RECHTE Maustaste) oder langsamer (LINKE Maustaste) sind als Ihre eigene Herzfrequenz.

        Die Töne sind IMMER langsamer oder schneller als Ihr Herzschlag. Bitte raten Sie, auch wenn Sie unsicher sind.
  Tutorial3bis:
    axis: exteroception
    values:
      'true': In manchen Durchgängen sehen Sie statt des Herzsymbols ein Hörsymbol. Dann hören
        Sie statt Ihres Herzschlags zunächst eine erste Folge von Tönen.
      'false': null
  Tutorial3ter:
    axis: device+exteroception
    values:
      keyboard/true: |-
        Nach diesen ersten Tönen erscheinen die Antwortsymbole, und eine zweite Folge von Tönen wird abgespielt.

        Hören Sie diesen Tönen zu und entscheiden Sie so schnell und so genau wie möglich, ob sie schneller (Taste NACH OBEN) oder langsamer (Taste NACH UNTEN) sind als die erste Folge von Tönen.

        Die zweite Folge von Tönen ist IMMER langsamer oder schneller als die erste. Bitte raten Sie, auch wenn Sie unsicher sind.
      keyboard/false: null
      mouse/true: |-
        Nach diesen ersten Tönen erscheinen die Antwortsymbole, und eine zweite Folge von Tönen wird abgespielt.

        Hören Sie diesen Tönen zu und entscheiden Sie so schnell und so genau wie möglich, ob sie schneller (RECHTE Maustaste) oder langsamer (LINKE Maustaste) sind als die erste Folge von Tönen.

        Die zweite Folge von Tönen ist IMMER langsamer oder schneller als die erste. Bitte raten Sie, auch wenn Sie unsicher sind.
      mouse/false: null
  Tutorial4:
    axis: device
    values:
      keyboard: |-
        Nachdem Sie Ihre Entscheidung getroffen haben, werden Sie außerdem gebeten anzugeben, wie sicher Sie sich bei dieser Entscheidung sind.

        Der höchste Wert bedeutet, dass Sie sich Ihrer Wahl vollkommen sicher sind. Der niedrigste Wert bedeutet, dass Sie das Gefühl hatten zu raten.

        Verwenden Sie die Pfeiltasten LINKS und RECHTS, um Ihre Einschätzung auszuwählen, und bestätigen Sie mit der Taste NACH UNTEN
      mouse: |-
        Nachdem Sie Ihre Entscheidung getroffen haben, werden Sie außerdem gebeten anzugeben, wie sicher Sie sich bei dieser Entscheidung sind.

        Der höchste Wert bedeutet, dass Sie sich Ihrer Wahl vollkommen sicher sind. Der niedrigste Wert bedeutet, dass Sie das Gefühl hatten zu raten.

        Verwenden Sie die Maus, um Ihre Einschätzung auszuwählen
  responseText:
    axis: device
    values:
      keyboard: Taste NACH UNTEN für langsamer - Taste NACH OBEN für schneller.
      mouse: LINKE Maustaste für langsamer - RECHTE Maustaste für schneller.
  textBreaks:
    axis: device
    values:
      keyboard: Pause. Sie können sich so lange ausruhen, wie Sie möchten. Wenn Sie mit der
        Aufgabe fortfahren möchten, drücken Sie die LEERTASTE.
      mouse: Pause. Sie können sich so lange ausruhen, wie Sie möchten. Wenn Sie mit der Aufgabe
        fortfahren möchten, klicken Sie mit der Maus.
  textNext:
    axis: device
    values:
      keyboard: Bitte drücken Sie die LEERTASTE, um fortzufahren
      mouse: Bitte klicken Sie mit der Maus, um fortzufahren
