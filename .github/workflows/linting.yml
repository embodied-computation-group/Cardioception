name: Linting

# This job was called "test" and its one step was called "Run tests and
# coverage", but it ran neither: the steps were mypy, black, isort and flake8.
# It is now named for what it does, and the test suite has a workflow of its own.
#
# black and isort ran *without* --check, and before flake8, so they rewrote the
# files in place and flake8 only ever saw the reformatted result. CI could not
# fail on formatting, and could pass on code a contributor's local flake8 would
# reject. They now check rather than write.

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - uses: actions/cache@v4
      name: Configure pip caching
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        pip install isort flake8 black mypy
        pip install types-setuptools
    - name: Type check
      run: mypy ./cardioception/ --ignore-missing-imports
    - name: Formatting
      run: |
        black --check --diff ./cardioception/ ./tests/
        isort --check --diff ./cardioception/ ./tests/
    - name: Lint
      run: flake8 ./cardioception/ --extend-ignore=E501
