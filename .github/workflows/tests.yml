name: Tests

# The test suite has never run in CI. It could not: run() blocks in waitInput,
# so both test_run tests waited forever for a keypress that no runner would
# provide. The autopilot and the replay recorder remove that, so the tasks can
# now be exercised end to end without hardware or a human.
#
# Two jobs, because they fail for different reasons and take very different
# amounts of time. `fast` needs no display and returns in seconds. `session`
# runs whole sessions under a virtual display and takes a few minutes.

on:
  push:
    branches: [master, "dev/**", "phase*/**"]
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    name: unit and property tests on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries PsychoPy links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libegl1 libglib2.0-0 libsdl2-2.0-0 \
            portaudio19-dev libasound2-dev libsndfile1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov
      # These touch no window and no device, so they are the fast feedback loop.
      - name: Run
        run: pytest tests/test_rng.py tests/test_stimuli.py -v

  session:
    name: full sessions under a virtual display
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: System libraries, plus a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglu1-mesa libegl1 libglib2.0-0 libsdl2-2.0-0 \
            portaudio19-dev libasound2-dev libsndfile1 \
            alsa-utils libasound2-plugins pulseaudio
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov pytest-timeout
      # xvfb gives the runner a screen but not a sound card, and the PTB
      # backend asks PortAudio for a speaker the moment the first tone is
      # constructed. This kernel ships no snd-dummy to load -- its
      # linux-modules-extra has no kernel/sound/drivers at all -- so the
      # device is a null PulseAudio sink, which PortAudio sees through ALSA
      # as `pulse` with 32 output channels and which discards what it plays.
      #
      # That is not sufficient on its own. PsychoPy's own
      # SpeakerDevice.getAvailableDevices() returns [] here even though
      # PsychPortAudio lists the device, and `audioDevice = 'default'` is the
      # sentinel for "no preference", which sends PsychoPy to that empty list
      # and straight into `IndexError: list index out of range`. Naming the
      # device takes the other branch, which resolves against PortAudio's own
      # list. The name has to be `pulse`: `default` is also a real ALSA
      # device here, but it collides with the sentinel. It is a list-valued
      # preference: assigning a bare string is silently rejected on save.
      # device here, but it collides with the sentinel.
      - name: A sound device for the tones to open
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dummy
          # Latency mode 0: nothing here measures audio latency, and the
          # aggressive modes ask a null sink for guarantees it cannot give.
          # The PTB backend opens the stream at the device's *maximum*
          # channel count and offers no override, and no device here reports
          # a plain stereo output: pulse says 32, and an ALSA plug wrapper
          # says 128 because plug advertises its widest convertible range.
          # A 32-channel stream rejects the mono tones outright; 128 hangs.
          # The sounddevice backend sizes the stream from the sound instead,
          # so it opens two channels on the same device. It is already a
          # PsychoPy dependency. Real sessions still use PTB; this is the
          # runner having no sound card, not a change to the task.
          python -c "from psychopy import prefs; prefs.hardware['audioLib'] = ['sounddevice']; prefs.hardware['audioDevice'] = ['pulse']; prefs.hardware['audioLatencyMode'] = 0; prefs.saveUserPrefs()"
          # Read it back in a fresh process: that is what pytest will see.
          python -c "from psychtoolbox import audio; [print('PTB:', d['DeviceName'], d['NrOutputChannels']) for d in audio.get_devices()]" || true
          python -c "from psychopy import prefs; print('audioLib ->', prefs.hardware['audioLib'], 'audioDevice ->', prefs.hardware['audioDevice'])"
      # A whole HRD session, both input devices, against the replay recorder.
      # This is the first time any CI job has run the task itself.
      #
      # A per-test timeout dumps the stack of whatever is stuck; thread
      # method, because the signal method cannot interrupt a blocking call
      # inside PortAudio. The previous round printed nothing at all before
      # the job cap, so the output is unbuffered too.
      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          xvfb-run -a pytest tests/test_headless.py -v --timeout=180 --timeout-method=thread --cov=cardioception --cov-report=term-missing
