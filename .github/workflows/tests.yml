name: Tests

# The test suite has never run in CI. It could not: run() blocks in waitInput,
# so both test_run tests waited forever for a keypress that no runner would
# provide. The autopilot and the replay recorder remove that, so the tasks can
# now be exercised end to end without hardware or a human.
#
# Two jobs, because they fail for different reasons and take very different
# amounts of time. `fast` needs no display and returns in seconds. `session`
# runs whole sessions under a virtual display and takes a few minutes.

on:
  push:
    branches: [master, "dev/**", "phase*/**"]
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    name: unit and property tests on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries PsychoPy links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libegl1 libglib2.0-0 libsdl2-2.0-0 \
            portaudio19-dev libasound2-dev libsndfile1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov
      # These touch no window and no device, so they are the fast feedback loop.
      - name: Run
        run: pytest tests/test_rng.py tests/test_stimuli.py -v

  session:
    name: full sessions under a virtual display
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: System libraries, plus a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglu1-mesa libegl1 libglib2.0-0 libsdl2-2.0-0 \
            portaudio19-dev libasound2-dev libsndfile1 \
            alsa-utils libasound2-plugins pulseaudio
      # xvfb gives the runner a screen but not a sound card, and PsychoPy's
      # PTB backend asks PortAudio for a speaker the moment the first tone is
      # constructed. With no device the list comes back empty and every session
      # test dies in SpeakerDevice with `IndexError: list index out of range`.
      # snd-dummy is a real ALSA card that discards whatever it is given; a null
      # PulseAudio sink is the fallback where that kernel module is unavailable.
      # Neither one plays anything, which is all the task needs.
      - name: A sound device for the tones to open
        run: |
          # snd-dummy is not in the runner's stock kernel; the module package
          # carries it. PulseAudio's null sink loads fine without it but
          # PortAudio does not enumerate it, so it is only a last resort.
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
          sudo modprobe snd-dummy || true
          if ! aplay -l 2>/dev/null | grep -q '^card'; then
            pulseaudio --start --exit-idle-time=-1
            pactl load-module module-null-sink sink_name=dummy
          fi
          aplay -l || true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov
      # A whole HRD session, both input devices, against the replay recorder.
      # This is the first time any CI job has run the task itself.
      - name: Run
        run: |
          python -c "import psychtoolbox as ptb; d = ptb.audio.get_devices(); print('PTB sees', len(d), 'devices')" || true
          xvfb-run -a pytest tests/test_headless.py -v --cov=cardioception --cov-report=term-missing
