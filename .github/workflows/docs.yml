name: Build and Deploy

on:
  push:
    branches:
      - master
      - main
      - dev
  pull_request:
    branches:
      - master
      - main
      - dev
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install --no-deps -e .
          pip install -r requirements-docs.txt

      - name: Build documentation
        run: |
          sphinx-build -b html docs/source docs/build/html

      # Build on every push and pull request to master or dev, publish only
      # from a push to master. Without this guard a pull request deployed
      # straight to gh-pages, so any PR could replace the live documentation
      # before anyone reviewed it, and a push to dev would publish unreleased
      # documentation. `main` exists and is built, but the site still deploys
      # from master until the 1.0.0 release: on release day, change the ref
      # below to refs/heads/main.
      - name: Deploy 🚀
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/build/html
          BRANCH: gh-pages
